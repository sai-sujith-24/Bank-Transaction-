name: Java build and smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac BankTransaction.java
      - run: |
          printf '123\nTest User\n1000\n500\n1\n200\n1\n900\n2\n' | java BankTransaction > output.txt
          grep -q 'Transaction Successful' output.txt
          grep -q 'Transaction Failed' output.txt
          grep -q 'Final Balance: Rs. 800.0' output.txt
      - run: |
          printf '123\nTest User\n-100\n500\n' | java BankTransaction > invalid.txt
          grep -q 'Invalid account configuration' invalid.txt
